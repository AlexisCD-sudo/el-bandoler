const J2=[['Benvingut a Tavertet, bandoler!','Aquí només hi passen cabres,','vent i algun boig dels cingles.'],['Amb les botes de cabra pots fer','un doble salt: saltes de nou a','l\'aire. Hi ha coses amagades!'],['Mira amunt, cap als cingles.','I si trobes una cabra... no li','discuteixis. Mai.']];
const J1=[['Bandoler! Sabia que vindries.','Gràcies, de debò. M\'has salvat la pell','i ara jo et dec la vida.'],['Tinc una cabana petita a Tavertet,','amagada entre els cingles.','Allà el sometent no et trobarà.'],['Vés-hi! Jo vinc de seguida.','Que Sant Martí et guiï!']];
const SIGNS=[[['AVÍS DE LA PASTORA:','Les cabres no volen ser molestades.','(Però cobren per ser-ho.)'],['Cal tocar les 4 esquelles, una a','cada racó dels cingles, i en l\'ordre','correcte. Hi ha 4 cabres.'],['Pista: la Perica no vol ser ni la','primera ni l\'última. Té molt de','caràcter, aquesta cabra.']],
[['Pista: el Tonet és un boc molt','enamorat: va SEMPRE just darrere','de la Margarida. Tothom ho sap.']],
[['Pista: la Muntsa és tímida i no','gosa anar mai després del Tonet.','Diu que fa olor de boc.'],['(Si ho trobes massa fàcil, la pastora','diu que no és culpa seva.)']],
[['La reixa només s\'obre si les 4','cabres canten en ordre. Si en fas','sonar una de falsa, comencen de nou.'],['Les cabres NO es poden sobornar.','Ho hem provat. Amb formatge també.']],
[['SALA SECRETA','Si això ho pot llegir tothom,','ja no és gaire secreta, oi?']],
[['Aquesta paret sembla fràgil...','Una bona càrrega de trabuc','faria caure la pedra.'],['(I els ratpenats no ajuden gens.)']],
[['CARTELL ESCRIT A MIG FER:','Cap a la dreta: El Camp (pagesos,','gallines i algun drama familiar).'],['Cap a Tavertet: tres hores a peu.','Cap al veguer: massa a prop, millor','no hi vagis.']],
[['Un foc petit, però de bon cor.','Aquí s\'hi han escalfat més de tres','bandolers i una cabra despistada.']],
[['Pots de mel, un formatge dur com una','pedra i una ampolla buida de ratafia.','Hi ha una nota: "Això ja s\'ho va beure".']],
[['Una barra de pa i una espelma. També','una carta sense acabar: "Estimat','veguer, no ens busquis, que..." I prou.']],
[['GALERIA DEL CONTRABAN','Per aquí passaven la sal i el tabac.','Ara només hi ha rates i alguna moneda.']],
[['PLETA DE LA PASTORA','Aquí hi guarda el formatge bo, el que','no es ven a ningú. Ni a tu, bandoler.'],['Si el veguer ho descobreix, es queda','sense pleta. I sense cabres. Mèèè...']],
[['ELS RASOS','Camí vell cap a Can Pruna. Els homes','del Capità Roca hi fan guàrdia.']],
[['CAN PRUNA','La campana del mas fa anys que no sona.','Diuen que algú la va fer callar.'],['(Una bona trabucada des de la cornisa','hi faria dir la seva...)']],
[['MINA DELS CONTRABANDISTES','Aquest túnel travessa la muntanya fins','a una casa que ja coneixes.']],
[['CAPELLA AMAGADA','Aquí resaven els bandolers abans','de baixar a la plana. Ni Déu ho diu.']],
[['SOTERRANI DE LA TORRE','Els veguers hi amagaven el que no','volien que ningú trobés. Ara és teu.']],
[['Algú ha gravat a la fusta, amb lletra','de cabra: «Mira amunt, a la dreta.','Hi ha una repisa que brilla. Salta dues vegades.»']]];
const LETTER=[['Dins del cofre hi ha el botí dels','pagesos. I una carta lacrada amb el','segell del veguer.'],['«Capità: la pubilla de Can Pruna és','a la Torre. Que ningú pugi fins que','signi la venda del mas. — El Veguer»'],['Algú ha de treure la noia d\'allà.','L\'escala de pedra del fons de la cambra','puja directament a la torre.']];
const QU1=[['Ei, tu! Sí, tu, el de l\'espasa!','Sóc la Quima, de Can Pruna.','El veguer em té tancada aquí dalt.'],['Han hissat l\'escala amb una corda','lligada al pal. El nus és ben amunt:','talla\'l amb l\'espasa i baixarà!'],['Hi ha una caixa per allà. Empeny-la','fins a la cornisa i puja-hi!','I res de fer-te el simpàtic, eh?']];
const QU2=[['Això! Quin soroll, per tots els sants!','Ara puja de pressa, que els soldats','ho han sentit!']];
const QU3=[['Ja era hora! Esperava un bandoler més','alt... però em conformo amb tu.'],['El veguer vol el mas de Can Pruna per','vendre\'l al Capità Roca. Em volia fer','signar el paper sota amenaça.'],['L\'he estripat abans que el signessin.','Pren, la medalla del meu avi, que també','va ser bandoler com tu.'],['Aquesta nit faré sonar la campana.','Collsacabra sencer sabrà que el','veguer ja no mana aquí.']];
const ROCA1=[['Així que tu ets el bandoler que ha','tret la pubilla de la torre...','Jo sóc el Capità Roca.'],['Can Pruna serà meu, amb paper o sense.','Defensa\'t, que no et faré cap favor!']],
ROCA2=[['Maleït... Em rendeixo, bandoler.','Can Pruna no és meu. Ni ho serà.'],['Baixa al celler: hi ha una mina de','contrabandistes que surt a una casa','amagada, al camí de Collsacabra.'],['Al fons del celler hi ha una paret','falsa. Un bon tret de trabuc la','farà caure. Fes-ho, i marxa.']],
FIN=[['Bandoler! Ho has aconseguit!','Aquí al refugi tothom ho sap ja:','el veguer ha fugit i Roca és vençut.'],['Aquesta nit sonarà la campana de Can','Pruna per tota la serra: el mas torna','a ser dels pagesos. Gràcies a tu.'],['I jo he fet sopa per a tothom, fins i','tot per al teu cavall. Surt a fora:','en Bunyol et deu esperar.']],
HORSE3=[['Bunyol! Hem tornat a casa, company.','El veguer ha fugit, Can Pruna és lliure','i tu ets el cavall d\'una llegenda.'],['I ara, què? Un camí llarg per davant:','les feixes de Collsacabra són nostres.','Anem?']],
